# Verificacion manual del catalogo de Punto Hogar Pijamas
# (no hay proveedores externos; el catalogo se edita manualmente en catalogo.js)
# Se ejecuta a mano desde la pestana Actions. Solo lectura: no hace push.
name: Verificar catalogo

on:
  workflow_dispatch: # permite ejecutarlo a mano desde la pestana Actions

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar catalogo.js
        run: |
          node --check catalogo.js
          node --check data/configuracion.js
          python3 scripts/validar_catalogo.py
