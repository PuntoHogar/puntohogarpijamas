# QA Smoke L4: revisa la tienda PUBLICADA una vez al dia (12:00 UTC).
# Para Punto Hogar Pijamas: verifica que la pagina carga correctamente.
name: QA smoke de producción

on:
  schedule:
    - cron: "0 12 * * *" # 07:00 Colombia
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: qa-smoke
  cancel-in-progress: false

env:
  # Dominio propio en produccion (el URL de GitHub Pages redirige 301 aqui)
  SITE_URL: https://puntohogarpijamas.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar tienda en vivo
        # --retry: evita abrir issue por un fallo transitorio de red del runner
        run: |
          curl -fsS -m 30 --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/" && echo "OK: Tienda accesible"
          curl -fsS -m 30 --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/legal.html" && echo "OK: Legal accesible"

      - name: Abrir o actualizar issue si fallo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const {data: abiertas} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'qa-smoke', per_page: 1});
            const cuerpo = '### 🔴 Smoke L4 de producción falló\n'
              + 'Corrida: ' + new Date().toISOString() + ' ([log completo]('
              + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
              + '/actions/runs/' + context.runId + '))';
            if (abiertas.length) {
              await github.rest.issues.createComment({...context.repo, issue_number: abiertas[0].number, body: cuerpo});
            } else {
              await github.rest.issues.create({...context.repo, title: '🔴 Producción: smoke QA falló', labels: ['qa-smoke'], body: cuerpo});
            }

      - name: Cerrar el issue si se recuperó
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const {data: abiertas} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'qa-smoke', per_page: 100});
            for (const i of abiertas) {
              await github.rest.issues.createComment({...context.repo, issue_number: i.number,
                body: '✅ Smoke L4 recuperado en ' + new Date().toISOString() + ' — cierro.'});
              await github.rest.issues.update({...context.repo, issue_number: i.number, state: 'closed'});
            }